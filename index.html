<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial;
        }

        .box {
            width: 85%;
            max-width: 400px;
            background: #222;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }

        input {
            width: 90%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 16px;
        }

        button {
            padding: 14px 30px;
            border: 0;
            border-radius: 10px;
            background: #ff6b00;
            color: white;
            font-size: 17px;
        }

        #openLink {
            display: none;
            margin-top: 20px;
            color: white;
            background: #e1306c;
            padding: 14px 25px;
            border-radius: 10px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>❓ Question</h1>

    <p>Is Instagram a social media platform?</p>

    <input
        id="answer"
        type="text"
        placeholder="Type true or false"
    >

    <br>

    <button onclick="checkAnswer()">
        Submit
    </button>

    <p id="message"></p>

    <!-- Backup link -->
    <a
        id="openLink"
        href="https://xhaccess.com/search/porn/"
        target="_blank"
        rel="noopener"
    >
        Open Instagram 📸
    </a>

</div>

<script>

function checkAnswer() {

    const answer = document
        .getElementById("answer")
        .value
        .trim()
        .toLowerCase();

    if (answer === "true" || answer === "yes") {

        document.getElementById("message").textContent =
            "Correct! 🚀";

        // Show a clickable Instagram button
        document.getElementById("openLink").style.display =
            "inline-block";

        // Try opening automatically
        window.location.href =
            "https://www.instagram.com/";

    } else {

        document.getElementById("message").textContent =
            "Wrong answer ❌";

    }
}

</script>

</body>
</html>
