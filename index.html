<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Website</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 400px;
            text-align: center;
            background: #222;
            padding: 30px;
            border-radius: 20px;
        }

        input {
            width: 90%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            background: #ff6b00;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            color: #aaa;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>❓ Question</h1>

    <p>Is Instagram a social media platform?</p>

    <input
        id="answer"
        type="text"
        placeholder="Type true or false"
    >

    <br>

    <button onclick="checkAnswer()">Submit</button>

    <div id="message"></div>

</div>

<script>

function checkAnswer() {

    let answer = document
        .getElementById("answer")
        .value
        .trim()
        .toLowerCase();

    // Instagram link
    const LINK = "xhaccess.com
https://xhaccess.com
xHamster - Free Porn Videos & XXX Movies/";

    if (answer === "true" || answer === "yes") {

        document.getElementById("message").textContent =
            "Correct! Opening Instagram... 🚀";

        window.open(LINK, "_blank");

    } else {

        document.getElementById("message").textContent =
            "Wrong answer ❌";

    }
}

</script>

</body>
</html>
