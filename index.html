<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HD Calculator PRO</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#000;
    --panel:#080a0c;
    --button:#222426;
    --button2:#101315;
    --text:#f4f4f4;
    --muted:#777;
    --orange:#ff7417;
    --border:#29333e;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

button,input,select{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:18px;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.logo{
    font-size:30px;
    font-weight:800;
}

.logo span{
    color:var(--orange);
}

.pro{
    color:var(--orange);
    border:1px solid var(--orange);
    border-radius:8px;
    padding:5px 9px;
    font-size:13px;
    margin-left:7px;
}

.header-right{
    display:flex;
    gap:5px;
}

.icon-btn{
    width:44px;
    height:44px;
    background:transparent;
    color:#aaa;
    font-size:23px;
    border-radius:50%;
}

.icon-btn:hover{
    color:var(--orange);
}

/* TABS */

.tabs{
    display:flex;
    justify-content:center;
    gap:45px;
    margin:5px 0 22px;
}

.tab{
    color:#777;
    font-size:22px;
    font-weight:700;
    background:none;
}

.tab.active{
    color:#eee;
}

/* MAIN */

.main{
    display:grid;
    grid-template-columns:minmax(0,1fr) 310px;
    gap:15px;
}

/* DISPLAY */

.display{
    min-height:220px;
    border:1px solid #27333e;
    border-radius:20px;
    padding:18px;
    background:linear-gradient(145deg,#030507,#090d10);
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    overflow:hidden;
}

.previous{
    color:#5f646a;
    text-align:right;
    min-height:65px;
    font-size:18px;
    line-height:1.8;
}

.expression{
    text-align:right;
    font-size:48px;
    font-weight:600;
    white-space:nowrap;
    overflow-x:auto;
}

.result{
    text-align:right;
    color:#aaa;
    font-size:25px;
    margin-top:5px;
}

/* MEMORY */

.memory{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin:12px 0;
}

.memory button{
    height:55px;
    background:var(--button2);
    border:1px solid var(--border);
    color:var(--orange);
    border-radius:13px;
    font-weight:bold;
}

/* SCIENTIFIC */

.scientific{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
    margin-bottom:12px;
}

.sci-btn{
    position:relative;
    height:58px;
    border-radius:15px;
    background:var(--button2);
    border:1px solid var(--border);
    color:#eee;
    font-size:18px;
}

.sci-btn:hover{
    border-color:var(--orange);
}

.pro-badge{
    position:absolute;
    top:4px;
    right:5px;
    background:var(--orange);
    color:#111;
    font-size:8px;
    font-weight:bold;
    padding:2px 5px;
    border-radius:8px;
}

/* KEYPAD */

.keypad{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.key{
    height:82px;
    border-radius:17px;
    background:var(--button);
    color:#eee;
    font-size:31px;
    transition:.1s;
}

.key:active{
    transform:scale(.96);
}

.operator,
.clear{
    color:var(--orange);
}

.equals{
    background:var(--orange);
    color:#fff;
}

/* SIDE */

.side{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.side-box{
    background:#050708;
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
}

.side-title{
    padding:16px;
    border-bottom:1px solid #20262c;
    color:var(--orange);
    font-size:18px;
    font-weight:bold;
}

.history{
    max-height:330px;
    overflow:auto;
}

.history-item{
    padding:13px 15px;
    border-bottom:1px solid #1b2025;
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.history-expression{
    color:#aaa;
}

.history-result{
    color:#eee;
}

.clear-history{
    margin:12px;
    width:calc(100% - 24px);
    padding:13px;
    border-radius:12px;
    background:#101316;
    color:#aaa;
}

/* QUICK TOOLS */

.quick{
    padding:4px 12px 12px;
}

.quick-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    background:none;
    color:#ddd;
    padding:12px 5px;
    border-bottom:1px solid #1d2227;
    text-align:left;
}

.quick-icon{
    width:34px;
    height:34px;
    border-radius:10px;
    display:grid;
    place-items:center;
    background:#111518;
    color:var(--orange);
    font-size:18px;
}

/* CONVERTER */

.converter{
    display:none;
}

.converter.active{
    display:block;
}

.converter-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.converter-card{
    min-height:125px;
    border-radius:18px;
    background:#000;
    color:#eee;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:10px;
    font-size:17px;
    border:1px solid transparent;
}

.converter-card:hover{
    border-color:var(--orange);
    background:#090a0b;
}

.converter-icon{
    font-size:35px;
}

/* WORKSPACE */

.converter-workspace{
    display:none;
}

.converter-workspace.show{
    display:block;
}

.converter-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
}

.back{
    background:#17191b;
    color:#fff;
    border-radius:12px;
    padding:10px 15px;
}

.converter-head h2{
    margin:0;
}

.converter-panel{
    border:1px solid var(--border);
    border-radius:20px;
    padding:18px;
    background:#07090a;
}

.converter-panel label{
    display:block;
    color:#aaa;
    margin:10px 0 6px;
}

.converter-panel input,
.converter-panel select{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #293039;
    outline:none;
    background:#111416;
    color:#fff;
}

.converter-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.convert-button{
    width:100%;
    margin-top:16px;
    padding:15px;
    background:var(--orange);
    color:#fff;
    border-radius:13px;
    font-weight:bold;
}

.convert-result{
    margin-top:18px;
    padding:18px;
    border-radius:14px;
    background:#111416;
    text-align:center;
    font-size:25px;
}

.note{
    color:#777;
    font-size:12px;
    margin-top:10px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    z-index:99;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:400px;
    background:#111416;
    border:1px solid #333c45;
    border-radius:22px;
    padding:25px;
    text-align:center;
}

.modal-box h2{
    color:var(--orange);
}

.close{
    background:#25282b;
    color:#fff;
    padding:12px 25px;
    border-radius:12px;
}

/* MOBILE */

@media(max-width:800px){

    .app{
        padding:10px;
    }

    .main{
        display:block;
    }

    .side{
        display:none;
    }

    .expression{
        font-size:42px;
    }

    .key{
        height:75px;
    }

    .sci-btn{
        height:52px;
        font-size:15px;
    }
}

@media(max-width:430px){

    .logo{
        font-size:24px;
    }

    .tabs{
        gap:35px;
    }

    .tab{
        font-size:20px;
    }

    .display{
        min-height:185px;
    }

    .expression{
        font-size:38px;
    }

    .key{
        height:70px;
        font-size:27px;
    }

    .memory button{
        font-size:12px;
    }

    .converter-card{
        min-height:105px;
        font-size:14px;
    }

    .converter-icon{
        font-size:28px;
    }
}
</style>

/* =========================
   CALCULATOR
========================= */

let expression = "";
let memory = 0;

const expressionEl =
    document.getElementById("expression");

const resultEl =
    document.getElementById("result");

const previousEl =
    document.getElementById("previous");


function updateDisplay(){
    expressionEl.textContent =
        expression || "0";
}


function append(value){

    if(expression === "Error"){
        expression = "";
    }

    expression += value;
    updateDisplay();
}


function clearAll(){

    expression = "";
    resultEl.textContent = "";
    previousEl.textContent = "";

    updateDisplay();
}


function backspace(){

    expression =
        expression.slice(0,-1);

    updateDisplay();
}

   2+2 SPECIAL LINK
========================= */

    if(!expression) return;

            expression

                .replace(/×/g,"*");

            !/^[0-9+\-*/().%\s]+$/
            .test(safe)

            Function(
                '"use strict";return ('+

        addHistory(
            expression,
            answer
        );

        expression =
            String(answer);

        updateDisplay();

    }catch{

        resultEl.textContent =
            "Error";
    }
}

    if(
        typeof number === "number" &&
        Number.isInteger(number)
    ){
        return number.toLocaleString();
    }

    return Number(number)
        .toLocaleString(
            undefined,
            {
                maximumFractionDigits:10
            }
        );
}
